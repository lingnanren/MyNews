name: Daily Finance Digest

on:
  schedule:
    - cron: "30 22 * * *"
  workflow_dispatch:

jobs:
  send-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Send finance digest
        env:
          MYNEWS_SMTP_HOST: ${{ secrets.MYNEWS_SMTP_HOST }}
          MYNEWS_SMTP_PORT: ${{ secrets.MYNEWS_SMTP_PORT }}
          MYNEWS_SMTP_USER: ${{ secrets.MYNEWS_SMTP_USER }}
          MYNEWS_SMTP_PASSWORD: ${{ secrets.MYNEWS_SMTP_PASSWORD }}
          MYNEWS_FROM_EMAIL: ${{ secrets.MYNEWS_FROM_EMAIL }}
        run: python -m mynews.cli --category finance --to yza15@qq.com

